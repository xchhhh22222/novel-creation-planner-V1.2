interface:
  display_name: "小说创造规划 V1.5"
  short_description: "充分榨取素材库：候选池扩展、原创重命名、10点预算菜单化"
  default_prompt: >-
    使用 $novel-creation-planner V1.5。不要按最低数量交作业。用户选定故事后，先读取material-pool-expansion.md：体系从素材库召回4-6套候选再激活2-3套；功法6-10候选选3-5；武技8-12候选选4-6；法宝/装备5-8候选选2-4。候选池要尽量跨书，必须展示来源机制和筛选过程。所有功法、武技、法宝的新书名称必须原创重命名，禁止直接沿用来源书专名。若当前金手指是“每日10点预算/随机菜单”型，必须读取golden-finger-menu-engine.md：每日随机显示10个明码标价商品，10点预算内允许买多个，不跨日；建立至少24个商品原型，每项都有1-10点价格、量化/可验证效果、外部资源依赖与素材来源；至少给出开篇期、第一高潮前、第二高潮前3张10项示例菜单和购买取舍。不要只写“气血控制/肉身适应/悟性”这类抽象词。
