interface:
  display_name: "小说创造规划 V1.3"
  short_description: "一个故事核心，三书名三开篇三素材金手指；用户选定后再做高潮倒推"
  default_prompt: >-
    使用 $novel-creation-planner V1.3。市场 Top10 与3本前20章只提炼节奏、情绪、钩子、目标接力和兑现结构，不得从市场层创造世界、金手指、体系、势力、法宝或战略目标物。进入创作前先读取 material-source-gates.md 和 material-dispatch.md，为 world_premise、primary_system、faction_ecology、resource_loop、golden_finger_candidates 建立真实素材来源。只构造一个 shared_story_core，不再设计 A/B/C 三个不同故事。随后严格输出3个书名、3个服务同一故事核心的开篇、3个来自素材库的金手指候选；金手指只能 DIRECT/ADAPT/HYBRID，不允许 ORIGINAL。素材不足就 GAP/HOLD。用户未选择书名、开篇和金手指前，停止，不生成正式 strategic_target、两个大高潮或前100章脊柱。用户确认后再继续 climax-backplanning。
