interface:
  display_name: "小说创造规划 V1.4"
  short_description: "选项确认后补100章局部Scale，再用状态跃迁设计两个大高潮"
  default_prompt: >-
    使用 $novel-creation-planner V1.4。沿用V1.3的市场结构学习、素材来源硬门与单书选项板。用户选定书名、开篇、金手指后，不要直接设计高潮；先读取local-scale-100.md，只规划前100章真正会用到的局部世界：4-7个当前势力及盟友/冲突关系、0-2个外部势力接口、2-3套当前体系及体系关系、当前境界、至少3个功法、3个武技、2个法宝/装备、3-6种普通资源、3-6个本地地图节点、金手指与外部资源/任务的接口。更大世界只留future hooks。SCALE_GATE通过后才进入climax-backplanning。每个大高潮必须明确实力前后、核心收获、身份前后、新权限、新责任/敌人和下一阶段问题。资格/排名/准入默认只作为access gate。100章结束输出handoff_after_100，供后继plan调用剩余素材。
