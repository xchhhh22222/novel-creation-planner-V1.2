interface:
  display_name: "小说创造规划 V1.7"
  short_description: "双入口：素材抽卡 / 三书熔炉；后续沿用世界→人物→势力→体系→金手指→剧情→Scale"
  default_prompt: >-
    使用 $novel-creation-planner V1.7。先读取 references/creation-entry-modes.md，只在两个入口中二选一：inspiration_draw 直接从 Nova 素材库召回世界观并展示9张候选；fusion_furnace 先执行同赛道 Top10→选3本→前20章结构熔炉，再回 Nova 展示9张世界观候选。当前素材域固定为都市高武，默认多女主，不需要男女频频道切换。世界核心确认后，不得直接生成立项，继续按既有 Planner 链执行：主角与多女主→势力生态→人物×势力绑定→4-6套修炼体系候选→功法6-10/武技8-12/装备5-8/普通资源→从02金手指按兼容性筛出9张候选供选择或融合→01/06/07/08/09剧情层→Local Scale 1-100→SCALE_GATE→战略目标物→两个大高潮→高潮倒推→1-100章脊柱。核心组件必须来自素材库并保留来源；候选不足时PARTIAL/HOLD，禁止AI原创凑满。
